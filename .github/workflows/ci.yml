name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Same bun as local bundling, so the bundle-freshness check compares like with like.
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - name: dist/cli.mjs is rebuilt and committed
        run: |
          bun run bundle
          git diff --exit-code dist/cli.mjs
